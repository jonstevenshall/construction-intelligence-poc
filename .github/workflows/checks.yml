name: Checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: docker compose --env-file /dev/null -f compose.coolify.yaml config --quiet
      - run: python -m earthworks.evaluate --demo
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: earthworks_test
          POSTGRES_USER: earthworks
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earthworks -d earthworks_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LAB_TEST_DATABASE_URL: postgresql://earthworks:ephemeral-ci-only@localhost:5432/earthworks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-postgres.txt
      - run: python -m unittest discover -s tests -p test_postgres.py -v
